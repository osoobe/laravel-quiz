name: Tests

# Runs entirely standalone from this package's own repo — no host Laravel app
# required. tests/TestCase.php boots the package via Orchestra Testbench +
# Workbench (see testbench.yaml and workbench/), so `composer install` here is
# enough on its own.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: laravel-quiz-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP tests (Pest via Testbench)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, bcmath, intl, curl, zip, gd
          coverage: none

      # Anonymous requests to codeload.github.com are rate-limited (HTTP 429) and have
      # no source fallback for "legacy.zip" dists — hits intermittently on packages like
      # pestphp/pest-plugin-arch, orchestra/sidekick. Composer only auto-aliases
      # api.github.com to the "github.com" auth entry — codeload.github.com (where the
      # actual dist zips download from) needs its own entry to pick up the token.
      - name: Authenticate Composer against GitHub
        run: |
          composer config -g github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"
          composer config -g github-oauth.codeload.github.com "${{ secrets.GITHUB_TOKEN }}"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: |
          n=0
          until [ $n -ge 3 ]; do
            composer install --no-interaction --prefer-dist --optimize-autoloader && exit 0
            n=$((n + 1))
            echo "Composer install failed (attempt $n/3) — retrying in 20s..."
            sleep 20
          done
          echo "Composer install failed after 3 attempts."
          exit 1

      - name: Run test suite
        run: vendor/bin/pest

  frontend:
    name: Frontend build & typecheck (SPA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # The React SPA ships pre-built (resources/dist/ is committed) — this doesn't
      # publish anything, it just proves resources/js-src/ still compiles cleanly.
      - name: Build
        run: npm run build

  style:
    name: Code style (Pint, advisory)
    runs-on: ubuntu-latest
    # Non-blocking: there's pre-existing Pint debt across this package predating
    # this workflow. Flip off once that's cleaned up.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: laravel/pint

      - name: Run Pint
        run: pint --test
